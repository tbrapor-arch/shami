<title>Shami Week {{WEEK}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans:ital,wght@0,400;0,600;1,400&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one reading column; a strip of lesson tiles on top, like a row of Damascene wall tiles; dialogue as the page's centre. */
:root{
  color-scheme:light; --bg:#f3f6f7; --surface:#ffffff; --ink:#14262e; --muted:#5b6f78; --line:#d5dfe3;
  --tile:#0e5a73; --tile-ink:#ffffff; --tile-soft:#dcecf1; --pom:#a8324a; --msa:#6a5a1e; --msa-soft:#f3edd3;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif; --f-kufi:"Reem Kufi","Noto Naskh Arabic",sans-serif; --f-lat:"Noto Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-lat);padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:700 30px/1 var(--f-kufi);color:var(--tile)} .brand span{font:600 15px var(--f-lat);color:var(--muted);margin-inline-start:8px}
nav{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
nav button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-lat);border-radius:4px;cursor:pointer;padding:0}
nav button[aria-current="true"]{background:var(--tile);color:var(--tile-ink);border-color:var(--tile)}
nav button.b{color:var(--msa)} nav button.b[aria-current="true"]{background:var(--msa);color:var(--bg);border-color:var(--msa)}
button:focus-visible{outline:2px solid var(--pom);outline-offset:2px}
.kicker{font:600 12px var(--f-lat);letter-spacing:.1em;text-transform:uppercase;color:var(--pom)}
h1{margin:2px 0 0;font:700 44px/1.25 var(--f-kufi);direction:rtl;text-align:start}
.sub{color:var(--tile);font-weight:600;font-size:18px} .scene{color:var(--muted);margin:6px 0 0;font-style:italic}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)} .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.playall{border:1px solid var(--tile);background:transparent;color:var(--tile);font:600 14px var(--f-lat);border-radius:4px;padding:8px 14px;cursor:pointer}
.dlg{display:flex;flex-direction:column;gap:4px}
.ln{padding:14px 0;border-top:1px solid var(--line)} .lh{display:flex;align-items:center;gap:10px}
.ln.on .pl{background:var(--tile);color:var(--tile-ink)}
.pl{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--tile);background:transparent;color:var(--tile);cursor:pointer;font-size:14px;display:grid;place-items:center}
.who{font:600 12px var(--f-lat);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ar{font:400 27px/1.9 var(--f-ar);direction:rtl;text-align:start}
.tr{color:var(--tile);font-weight:600} .lit{color:var(--muted);font-size:13.5px;font-style:italic} .en{margin-top:2px}
.ln.msa .ar,.ln.msa .tr{color:var(--msa)} .ln.msa .who::after{content:" · MSA";color:var(--msa)}
body.no-tr .dlg .tr,body.no-lit .lit,body.no-en .dlg .en{display:none}
h2{font:600 13px var(--f-lat);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;padding-top:16px;border-top:2px solid var(--tile)}
.note{margin:0;padding:10px 0;border-bottom:1px solid var(--line)} .note b{color:var(--tile)}
.sec h3{font:600 17px var(--f-lat);margin:14px 0 4px} .sec p{margin:4px 0}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:15px} th,td{text-align:start;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top} th{font:600 12px var(--f-lat);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.a{font:400 20px/1.6 var(--f-ar);direction:rtl;white-space:nowrap} td.m{color:var(--msa)} td.s{color:var(--tile);font-weight:600}
.words{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 16px;align-items:baseline} .words .a{font:400 22px/1.6 var(--f-ar);direction:rtl} .words .t{color:var(--tile);font-weight:600}
.ex{display:flex;flex-direction:column;gap:8px} .q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.q .a{font:400 22px/1.7 var(--f-ar);direction:rtl;text-align:start;display:block} .q .ans{display:block;color:var(--pom);font-weight:600} .q:not(.open) .ans{visibility:hidden} .q small{color:var(--muted)}
.nbtn{align-self:flex-start;margin:10px 0 0;border:1px solid var(--tile);background:var(--tile-soft);color:var(--tile);font:600 14px var(--f-lat);border-radius:4px;padding:8px 14px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:75vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--tile)}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:-14px;background:var(--surface);padding:6px 0 8px}
.x{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mode button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-lat);padding:8px 12px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--tile-soft);color:var(--tile)}
.pairs{display:flex;flex-direction:column;gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pc .ref{font:600 12px var(--f-lat);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sides{display:grid;gap:10px}
.sd{display:flex;gap:10px;align-items:flex-start;min-width:0}
.sd>div{min-width:0;flex:1}
.sd .lab{font:700 11px var(--f-lat);letter-spacing:.1em;text-transform:uppercase}
.sd.s .lab{color:var(--tile)} .sd.m .lab{color:var(--msa)}
.sd.m{border-top:1px dashed var(--line);padding-top:10px}
.sd .ar{font-size:25px;line-height:1.8} .sd.m .ar,.sd.m .tr{color:var(--msa)}
.pc .en{color:var(--muted);font-size:14px}
.pc.hide-s .sd.s>div,.pc.hide-m .sd.m>div{filter:blur(7px);user-select:none}
.peek{font:600 12px var(--f-lat);color:var(--pom);border:0;background:transparent;cursor:pointer;padding:0;align-self:flex-start}
.rules{display:flex;flex-direction:column;gap:0}
.rule{padding:12px 0;border-bottom:1px solid var(--line)} .rule h3{margin:0 0 4px;font:600 17px var(--f-lat);color:var(--tile)} .rule p{margin:0}
.rex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px} .rex span{font-size:13.5px;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.rex b{color:var(--tile);font-weight:600} .rex i{color:var(--msa);font-style:normal}
.sheet .pair{font-size:17px;margin:6px 0 10px} .sheet .pair .s{color:var(--tile);font-weight:600} .sheet .pair .m{color:var(--msa);font-weight:600}
.sheet .pair .ara{font:400 24px/1.7 var(--f-ar)}
@media (min-width:760px){body.wide main{max-width:980px}.sides{grid-template-columns:1fr 1fr}.sd.m{border-top:0;padding-top:0;border-inline-start:1px dashed var(--line);padding-inline-start:12px}}
.nt{border-bottom:1.5px dotted var(--tile);cursor:pointer}.nt.on,mark.on{background:var(--tile-soft)}
.pop{position:absolute;z-index:30;width:min(290px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--tile);border-radius:6px;box-shadow:0 6px 22px rgba(20,38,46,.18);padding:10px 12px;font:400 14px/1.45 var(--f-lat)}
.pop b{display:block;color:var(--tile);margin-bottom:3px}.pop .pp{display:block;margin-bottom:4px;font-weight:600}.pop .s{color:var(--tile)}.pop .m{color:var(--msa)}
.nb{display:inline-grid;place-items:center;vertical-align:super;width:22px;height:22px;margin-inline-start:6px;border-radius:50%;border:0;background:var(--tile);color:var(--tile-ink);font:700 12px/1 var(--f-lat);cursor:pointer;padding:0;direction:ltr}
.nbs{direction:ltr;unicode-bidi:isolate;display:inline-flex;gap:4px;margin-inline-start:6px;vertical-align:super} .nbs .nb{margin:0;vertical-align:baseline}
.sd.m .nb{background:var(--msa)} .nb.on{outline:2px solid var(--pom);outline-offset:2px}
.ov{background:rgba(20,38,46,.18)}
.sheet{border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:6px -2px 0 var(--tile)}
.grip{width:44px;height:5px;border-radius:3px;background:var(--ink);margin:0 auto 6px}
.kick{font:700 12px var(--f-lat);letter-spacing:.1em;text-transform:uppercase;color:var(--tile)}
.nhead{display:inline-block;padding-bottom:8px;border-bottom:3px solid var(--tile);max-width:100%}
.ntr{font:600 17px/1.3 var(--f-lat);color:var(--tile)} .nhead .nar{font:400 30px/1.6 var(--f-ar);color:var(--ink);text-align:start;margin:0}
.ia{font:400 1.3em/1 var(--f-ar);unicode-bidi:isolate;color:var(--ink)} .it{color:var(--tile);font-style:normal;font-weight:600}
.alln{margin-top:28px;border-top:1px solid var(--line);padding-top:10px} .alln summary{cursor:pointer;font:700 13px var(--f-lat);letter-spacing:.08em;text-transform:uppercase;color:var(--tile);padding:6px 0}
.an{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.55} .an .nb{flex:none;margin:2px 0 0;vertical-align:top} .an>div{min-width:0}
.an-h{margin-bottom:2px} .an-h span{font:400 22px var(--f-ar);unicode-bidi:isolate} .an-h b{color:var(--tile);margin-inline-start:6px}
.nar{font:400 26px/1.7 var(--f-ar);direction:rtl;text-align:start;margin-top:6px}
.nbody{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:16px;line-height:1.5} .nbody b{display:block;color:var(--tile);margin-bottom:4px}
.ntag{margin-top:12px;font:700 12px var(--f-lat);letter-spacing:.06em;text-transform:uppercase;color:var(--msa)} .ntag span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.nnav{display:flex;gap:10px;margin-top:16px} .nnav button{font:600 15px var(--f-lat);border-radius:6px;padding:10px 16px;cursor:pointer;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.nnav .next{background:var(--tile);border-color:var(--tile);color:var(--tile-ink)} .nnav button:disabled{opacity:.35;cursor:default}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:480px){h1{font-size:36px}.ar{font-size:24px}.words{grid-template-columns:auto minmax(0,1fr)}.words .e{grid-column:1/-1;margin-bottom:6px}}
</style>
<main>
<header><div class="brand">شامي<span>Shami · week {{WEEK}}</span></div></header>
<nav id="nav" aria-label="Lessons"></nav>
<article id="lesson"></article>
<footer>Draft lessons, not yet checked by a native speaker. Voices are synthetic (Microsoft, Syrian Arabic): a guide to rhythm and melody, not a native speaker.</footer>
</main>
<script>
const L=/*DATA*/[];
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
let au=new Audio(),cur=null,queue=[];
function stop(){au.pause();if(cur)cur.classList.remove('on');cur=null}
function play(row,src,next){stop();cur=row;row.classList.add('on');au=new Audio('data:audio/mpeg;base64,'+src);au.onended=()=>{row.classList.remove('on');cur=null;if(next)next()};au.play().catch(()=>{})}
function show(i){stop();closeNotes();unpop();NT=[];const d=L[i],el=document.getElementById('lesson');el.innerHTML='';document.body.classList.toggle('wide',!!d.sides);
  document.querySelectorAll('#nav button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
  el.append($('div','kicker',d.bridge?'Bridge to Modern Standard Arabic':d.review?'Revision':'Lesson '+d.n));
  el.append($('h1','',esc(d.title.ar)),$('div','sub',esc(d.title.tr)+' · '+esc(d.title.en)),$('p','scene',esc(d.scene||'')));
  if(d.loose&&d.loose.length){const nb=$('button','nbtn','ⓘ Notes · '+d.loose.length);nb.onclick=()=>openNotes({title:d.title,notes:d.loose.map(k=>d.notes[k])});el.append(nb)}
  const secs=()=>(d.sections||[]).forEach(s=>{const b=$('div','sec');b.append($('h3','',esc(s.title)));if(s.text)b.append($('p','',esc(s.text)));if(s.table)b.append(tbl(s.table));if(s.after)b.append($('p','',esc(s.after)));el.append(b)});
  if(d.review)secs();
  if(d.lines){const o=$('div','opts');o.innerHTML='<button class="playall" id="pa">▶ Play the dialogue</button>'+[['tr','Transcription'],['lit','Word for word'],['en','English']].map(([k,t])=>`<label><input type="checkbox" id="o-${k}" ${document.body.classList.contains('no-'+k)?'':'checked'}> ${t}</label>`).join('');
    const g=$('div','dlg');el.append($('h2','','Dialogue'),o,g);
    const seenN={};const rows=d.lines.map((l,li)=>{const r=$('div','ln'+(l.lang==='msa'?' msa':''));const b=$('button','pl','▶');b.setAttribute('aria-label','Play line');const c=$('div'),h=$('div','lh');h.append(b,$('div','who',esc(l.name)));
      const bd=(l.marks||[]).map(m=>m[2]).filter(k=>!(k in seenN)).map(k=>{seenN[k]=NT.length;const n=d.notes[k];NT.push({where:'line '+(li+1)+' · '+n.topic,tr:n.tr,ar:n.ar,body:n.text});return badge(NT.length-1)}).join('');
      c.innerHTML=`<div class="ar" lang="ar">${esc(l.ar)}${bd?`<span class="nbs">${bd}</span>`:''}</div><div class="tr">${esc(l.tr)}</div><div class="lit">${esc(l.lit)}</div><div class="en">${esc(l.en)}</div>`;
      b.onclick=()=>cur===r?stop():play(r,l.audio);r.append(h,c);g.append(r);return[r,l]});
    o.querySelector('#pa').onclick=()=>{let k=0;const nx=()=>{if(k<rows.length){const[r,l]=rows[k++];play(r,l.audio,nx)}};nx()};
    ['tr','lit','en'].forEach(k=>o.querySelector('#o-'+k).onchange=e=>document.body.classList.toggle('no-'+k,!e.target.checked))}
  if(d.sides)renderSides(d,el);
  if(!d.review)secs();
  if(d.rules){el.append($('h2','','The rules'));const r=$('div','rules');d.rules.forEach(x=>{const b=$('div','rule');b.id='r-'+x.id;b.innerHTML=`<h3>${esc(x.title)}</h3><p>${md(x.text)}</p>`;const ex=examples(d,x.id);if(ex.length){const e=$('div','rex');ex.forEach(h=>e.append($('span','',`<b>${esc(h[1])}</b> · <i>${esc(h[3])}</i>`)));b.append(e)}r.append(b)});el.append(r)}
  if(d.pairs){el.append($('h2','','Side by side'));const t={head:d.pairs.head,rows:d.pairs.rows};el.append(tbl(t,['s','a','m','a','']))}
  if(d.words){el.append($('h2','','New words'));const w=$('div','words');d.words.forEach(x=>w.append($('span','a',esc(x.ar)),$('span','t',esc(x.tr)),$('span','e',esc(x.en))));el.append(w)}
  const p=d.practice||{};
  if(p.translate){el.append($('h2','','Practice 1 · understand, then tap to check'));const x=$('div','ex');p.translate.forEach(q=>x.append(qa(`<span class="a" lang="ar">${esc(q.ar)}</span><small>${esc(q.tr)}</small>`,q.en)));el.append(x)}
  if(p.fill){el.append($('h2','',(p.translate?'Practice 2':'Practice')+' · fill the gap, then tap to check'));const x=$('div','ex');p.fill.forEach(q=>x.append(qa(`${esc(q.tr)}<br><small>${esc(q.en)}</small>`,q.answer)));el.append(x)}
  allNotes(el);
  window.scrollTo(0,0)}
function openNotes(d){closeNotes();const o=$('div','ov');o.id='ov';const sh=$('div','sheet');
  sh.innerHTML='<div class="sh-h"><b>Notes · '+esc(d.title.en)+'</b><button class="x" aria-label="Close">✕</button></div>'+d.notes.map(n=>`<p class="note"><b>${esc(n.anchor)}</b><br>${esc(n.text)}</p>`).join('');
  o.onclick=e=>{if(e.target===o)closeNotes()};sh.querySelector('.x').onclick=closeNotes;o.append(sh);document.body.append(o)}
function closeNotes(){const o=document.getElementById('ov');if(o)o.remove();document.querySelectorAll('.nb.on').forEach(x=>x.classList.remove('on'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNotes()});
function examples(d,id){const seen=new Set(),out=[];d.sides.forEach(p=>p.hl.forEach(h=>{if(h[4]===id&&!seen.has(h[1])){seen.add(h[1]);out.push(h)}}));return out}
function mark(text,subs){const sp=[];subs.forEach(([s,k])=>{let at=text.indexOf(s);while(at>=0&&sp.some(x=>at<x[1]&&at+s.length>x[0]))at=text.indexOf(s,at+1);if(at>=0)sp.push([at,at+s.length,k])});
  sp.sort((a,b)=>a[0]-b[0]);let o='',p=0;sp.forEach(([a,b,k])=>{o+=esc(text.slice(p,a))+`<mark data-k="${k}">${esc(text.slice(a,b))}</mark>`;p=b});return o+esc(text.slice(p))}
let sideMode='both';
function renderSides(d,el){const rules=Object.fromEntries((d.rules||[]).map(r=>[r.id,r]));
  const o=$('div','opts');o.innerHTML='<div class="mode" role="group" aria-label="Show">'+[['both','Both'],['s','Shami only'],['m','MSA only']].map(([k,t])=>`<button data-m="${k}" aria-pressed="${sideMode===k}">${t}</button>`).join('')+'</div>';
  const g=$('div','pairs');el.append($('h2','','Side by side'),o,g);
  const cards=d.sides.map(p=>{const c=$('div','pc');const s=p.sh,m=p.msa;
    const bd=p.hl.map(h=>{const r=rules[h[4]];NT.push({where:'lesson '+p.lesson+' · '+s.name,tr:h[1]+' ↔ '+h[3],ar:h[0]+' ↔ '+h[2],tag:r.short,body:h[5]});return badge(NT.length-1)}).join('');
    c.innerHTML=`<div class="ref">Lesson ${esc(p.lesson)} · ${esc(s.name)}</div><div class="sides">
      <div class="sd s"><button class="pl" aria-label="Play Shami">▶</button><div><div class="lab">Shami</div><div class="ar" lang="ar">${esc(s.ar)}</div><div class="tr">${esc(s.tr)}</div></div></div>
      <div class="sd m"><button class="pl" aria-label="Play MSA">▶</button><div><div class="lab">MSA</div><div class="ar" lang="ar">${esc(m.ar)}${bd?`<span class="nbs">${bd}</span>`:''}</div><div class="tr">${esc(m.tr)}</div></div></div>
      </div><div class="en">${esc(s.en)}</div><button class="peek" hidden>Tap to reveal</button>`;
    const [ps,pm]=c.querySelectorAll('.pl');ps.onclick=()=>cur===c?stop():play(c,s.audio);pm.onclick=()=>cur===c?stop():play(c,m.audio);
    const pk=c.querySelector('.peek');c.onclick=e=>{if(e.target.closest('.pl'))return;if(c.classList.contains('hide-s')||c.classList.contains('hide-m')){c.classList.remove('hide-s','hide-m');pk.hidden=true}};
    g.append(c);return c});
  const apply=()=>{o.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===sideMode));cards.forEach(c=>{c.classList.toggle('hide-m',sideMode==='s');c.classList.toggle('hide-s',sideMode==='m');c.querySelector('.peek').hidden=sideMode==='both'})};
  o.querySelectorAll('button').forEach(b=>b.onclick=()=>{sideMode=b.dataset.m;apply()});apply()}
function sheet(title,html){closeNotes();const o=$('div','ov');o.id='ov';const sh=$('div','sheet');
  sh.innerHTML='<div class="sh-h"><b>'+esc(title)+'</b><button class="x" aria-label="Close">✕</button></div>'+html;
  o.onclick=e=>{if(e.target===o)closeNotes()};sh.querySelector('.x').onclick=closeNotes;o.append(sh);document.body.append(o)}
function marks(t,ms){let o='',p=0;(ms||[]).forEach(([a,b,k])=>{o+=esc(t.slice(p,a))+`<span class="nt" data-n="${k}" role="button" tabindex="0">${esc(t.slice(a,b))}</span>`;p=b});return o+esc(t.slice(p))}
function unpop(){const q=document.getElementById('pop');if(q)q.remove();document.querySelectorAll('.nt.on,mark.on').forEach(x=>x.classList.remove('on'))}
function pop(anchor,html){const was=anchor.classList.contains('on');unpop();if(was)return;anchor.classList.add('on');
  const q=$('div','pop',html);q.id='pop';document.body.append(q);const r=anchor.getBoundingClientRect(),w=q.offsetWidth,h=q.offsetHeight,vw=document.documentElement.clientWidth;
  let x=Math.min(Math.max(12,r.left+r.width/2-w/2),vw-w-12),y=r.bottom+8;if(y+h>innerHeight-8&&r.top-h-8>0)y=r.top-h-8;
  q.style.left=x+'px';q.style.top=(y+scrollY)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))unpop()});addEventListener('resize',unpop);
let NT=[];
function badge(i){return `<button class="nb" data-i="${i}" aria-label="Note ${i+1}">${i+1}</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('.nb');if(!b)return;const c=b.closest('.pc');if(c&&(c.classList.contains('hide-s')||c.classList.contains('hide-m')))return;e.stopPropagation();noteSheet(+b.dataset.i)},true);
function noteSheet(i){closeNotes();const n=NT[i];const o=$('div','ov');o.id='ov';const sh=$('div','sheet');
  sh.innerHTML=`<div class="grip"></div><div class="sh-h"><span class="kick">Notes · ${i+1} of ${NT.length} · ${esc(n.where)}</span><button class="x" aria-label="Close">✕</button></div>
  <div class="nhead"><div class="ntr">${esc(n.tr)}</div><div class="nar" lang="ar" dir="rtl">${esc(n.ar)}</div></div><div class="nbody">${md(n.body)}</div>${n.tag?`<div class="ntag">Rule · ${esc(n.tag)} <span>(see The rules, below)</span></div>`:''}
  <div class="nnav"><button class="prev" ${i?'':'disabled'}>‹ Previous</button><button class="next" ${i<NT.length-1?'':'disabled'}>Next ›</button></div>`;
  o.onclick=e=>{if(e.target===o)closeNotes()};sh.querySelector('.x').onclick=closeNotes;
  sh.querySelector('.prev').onclick=()=>noteSheet(i-1);sh.querySelector('.next').onclick=()=>noteSheet(i+1);
  document.querySelectorAll('.nb.on').forEach(x=>x.classList.remove('on'));const bb=document.querySelector(`.nb[data-i="${i}"]`);if(bb){bb.classList.add('on');window.scrollTo({top:bb.getBoundingClientRect().top+scrollY-110,behavior:'smooth'})}
  o.append(sh);document.body.append(o)}
function md(t){return esc(t).replace(/\{([^|{}]+)\|([^{}]+)\}/g,(_,a,b)=>`<span class="ia" lang="ar" dir="rtl">${a}</span> <i class="it">${b}</i>`)}
function allNotes(el){if(!NT.length)return;const dt=$('details','alln');dt.innerHTML=`<summary>All notes · ${NT.length}</summary>`+NT.map((n,i)=>`<div class="an"><button class="nb" data-i="${i}">${i+1}</button><div><div class="an-h"><span lang="ar" dir="rtl">${esc(n.ar)}</span> <b>${esc(n.tr)}</b></div><div>${md(n.body)}</div></div></div>`).join('');el.append(dt)}
function qa(h,a){const b=$('button','q',h+`<span class="ans">${esc(a)}</span>`);b.onclick=()=>b.classList.toggle('open');return b}
function tbl(t,cls){const w=$('div','tw'),e=$('table');e.innerHTML='<tr>'+t.head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${cls?cls[i]:''}">${esc(c)}</td>`).join('')+'</tr>').join('');w.append(e);return w}
const nav=document.getElementById('nav');L.forEach((d,i)=>{const b=$('button',d.bridge?'b':'',esc(d.n));b.title=d.title.en;b.onclick=()=>show(i);nav.append(b)});show(0);
</script>
