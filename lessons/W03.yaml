# Shami, week 3: lessons 15–21 and bridge B3.
# Original text written for this course. Not yet checked by a native speaker.
week: 3
cast:
  adam: {name: "Adam", ar: "آدم", voice: ar-SY-LaithNeural}
  sami: {name: "Sāmi", ar: "سامي", voice: ar-SY-LaithNeural, pitch: "-12Hz"}
  abu:  {name: "Abu Sāmi", ar: "أبو سامي", voice: ar-SY-LaithNeural, pitch: "-25Hz", rate: "-6%"}
  umm:  {name: "Umm Sāmi", ar: "إم سامي", voice: ar-SY-AmanyNeural}
  lina: {name: "Līna", ar: "لينا", voice: ar-SY-AmanyNeural, pitch: "+12Hz"}
  teta: {name: "Tēta", ar: "تيتا", voice: ar-SY-AmanyNeural, pitch: "-18Hz", rate: "-8%"}
  mama: {name: "Mama", ar: "ماما", voice: ar-SY-AmanyNeural, pitch: "+4Hz", rate: "+4%"}
  baba: {name: "Bāba (Nabīl)", ar: "بابا", voice: ar-SY-LaithNeural, pitch: "-30Hz", rate: "-4%"}

lessons:
  - id: L015
    n: 15
    title: {ar: "السّاعة أَدّيش؟", tr: "is-sā3a ʔaddēš?", en: "What time is it?"}
    scene: "Early morning at a minibus stop in Mezze. Sāmi and Adam are heading for the old city."
    lines:
      - {who: adam, ar: "سامي، السّاعة أَدّيش؟", tr: "Sāmi, is-sā3a ʔaddēš?", lit: "Sami, the-hour how-much?", en: "Sāmi, what time is it?"}
      - {who: sami, ar: "السّاعة تْمانة ورُبْع. المِكْرو بْيِطْلَع تْمانة ونُصّ.", tr: "is-sā3a tmāne w-rub3. il-mikro byiṭla3 tmāne w-nuṣṣ.", lit: "the-hour eight and-quarter. the-minibus it-leaves eight and-half", en: "It's a quarter past eight. The minibus leaves at half past eight."}
      - {who: adam, ar: "والسّاعة أَدّيش مْنوصَل؟", tr: "w-is-sā3a ʔaddēš mnūṣal?", lit: "and-the-hour how-much we-arrive?", en: "And what time do we get there?"}
      - {who: sami, ar: "تِسْعة إلّا رُبْع، إذا ما في عَجْقة.", tr: "tis3a ʔilla rub3, ʔiza mā fī 3ajʔa.", lit: "nine except quarter, if not there-is jam", en: "A quarter to nine, if there's no traffic."}
      - {who: adam, ar: "وإذا في عَجْقة؟", tr: "w-ʔiza fī 3ajʔa?", lit: "and-if there-is jam?", en: "And if there is traffic?"}
      - {who: sami, ar: "تِسْعة ونُصّ، أَوْ عَشْرة... الله أَعْلَم!", tr: "tis3a w-nuṣṣ, ʔaw 3ašra... ʔalla ʔa3lam!", lit: "nine and-half, or ten... God most-knowing", en: "Half past nine, or ten... God knows!"}
    notes:
      - {line: 1, ar: "السّاعة أَدّيش؟", tr: "is-sā3a ʔaddēš?", topic: grammar, text: "'What time is it?', literally 'the hour (is) how much?'. {أَدّيش|ʔaddēš} 'how much' (lesson 13) is also the question for clock time. You can put it first too: {أَدّيش السّاعة؟|ʔaddēš is-sā3a?}."}
      - {line: 2, ar: "تْمانة ورُبْع", tr: "tmāne w-rub3", topic: grammar, text: "Clock time is {السّاعة|is-sā3a} + the hour: {السّاعة تْمانة|is-sā3a tmāne} 'eight o'clock'. Then add {ورُبْع|w-rub3} 'and a quarter', {ونُصّ|w-nuṣṣ} 'and a half'. 'At eight' needs no extra word: {المِكْرو بْيِطْلَع تْمانة ونُصّ|il-mikro byiṭla3 tmāne w-nuṣṣ}. The table is below the dialogue."}
      - {line: 2, ar: "المِكْرو", tr: "il-mikro", topic: culture, text: "{المِكْرو|il-mikro}, also {السَّرْفيس|is-sarvīs}: the white minibuses that criss-cross Damascus on fixed routes. You wave one down anywhere along its route and pass your fare to the driver."}
      - {line: 2, ar: "بْيِطْلَع", tr: "byiṭla3", topic: vocab, text: "{طِلِع|ṭili3} 'to go up, to go out, to leave': {بْيِطْلَع|byiṭla3} 'it leaves'. You also 'go up' into a bus: {طْلَعْت بِالمِكْرو|ṭla3t bil-mikro} 'I got on the minibus'."}
      - {line: 3, ar: "مْنوصَل", tr: "mnūṣal", topic: grammar, text: "{وِصِل|wiṣil} 'to arrive': {مْنوصَل|mnūṣal} 'we arrive'. 'We' with b- starts with m(i)n- (lesson 10). The question word can come last: {والسّاعة أَدّيش مْنوصَل؟|w-is-sā3a ʔaddēš mnūṣal?}."}
      - {line: 4, ar: "تِسْعة إلّا رُبْع", tr: "tis3a ʔilla rub3", topic: grammar, text: "{إلّا|ʔilla} 'except, less': {تِسْعة إلّا رُبْع|tis3a ʔilla rub3} 'a quarter to nine'. With {تِلْت|tilt} 'a third' (20 minutes): {تِسْعة إلّا تِلْت|tis3a ʔilla tilt} 'twenty to nine'."}
      - {line: 4, ar: "إذا ما في عَجْقة", tr: "ʔiza mā fī 3ajʔa", topic: vocab, text: "{إذا|ʔiza} 'if' (as in {إذا بِتْريد|ʔiza bitrīd}, lesson 8). {عَجْقة|3ajʔa} 'traffic jam, crowd': a word you will hear every day in Damascus."}
      - {line: 6, ar: "الله أَعْلَم", tr: "ʔalla ʔa3lam", topic: culture, text: "'God knows best': the honest answer about anything nobody can predict. {أَوْ|ʔaw} 'or' in a statement; in a question 'or' is {وِلّا|willa} (lesson 5)."}
    sections:
      - title: "Telling the time"
        table:
          head: ["", "Shami", ""]
          rows:
            - ["8:00", "tmāne", "تْمانة"]
            - ["8:05", "tmāne w-xamse", "تْمانة وخَمْسة"]
            - ["8:10", "tmāne w-3ašra", "تْمانة وعَشْرة"]
            - ["8:15", "tmāne w-rub3", "تْمانة ورُبْع"]
            - ["8:20", "tmāne w-tilt", "تْمانة وتِلْت"]
            - ["8:30", "tmāne w-nuṣṣ", "تْمانة ونُصّ"]
            - ["8:40", "tis3a ʔilla tilt", "تِسْعة إلّا تِلْت"]
            - ["8:45", "tis3a ʔilla rub3", "تِسْعة إلّا رُبْع"]
            - ["8:55", "tis3a ʔilla xamse", "تِسْعة إلّا خَمْسة"]
        after: "The hours: waḥde, tintēn, tlāte, ʔarb3a, xamse, sitte, sab3a, tmāne, tis3a, 3ašra, ḥdāšar, tnāšar. One and two take their feminine forms, because sā3a is feminine. 'In the morning' is iṣ-ṣubḥ, 'in the evening' il-masa."
    words:
      - {ar: "ساعة", tr: "sā3a", en: "hour; watch, clock"}
      - {ar: "ربع", tr: "rub3", en: "quarter"}
      - {ar: "تلت", tr: "tilt", en: "third; twenty minutes"}
      - {ar: "إلّا", tr: "ʔilla", en: "except; (time) to"}
      - {ar: "مكرو", tr: "mikro", en: "minibus"}
      - {ar: "طلع", tr: "ṭili3 (byiṭla3)", en: "to go up, go out, leave"}
      - {ar: "وصل", tr: "wiṣil (byūṣal)", en: "to arrive"}
      - {ar: "إذا", tr: "ʔiza", en: "if"}
      - {ar: "عجقة", tr: "3ajʔa", en: "traffic jam, crowd"}
      - {ar: "أو", tr: "ʔaw", en: "or"}
    practice:
      translate:
        - {ar: "السّاعة عشرة ونصّ.", tr: "is-sā3a 3ašra w-nuṣṣ.", en: "It's half past ten."}
        - {ar: "السّاعة تلاتة إلّا ربع.", tr: "is-sā3a tlāte ʔilla rub3.", en: "It's a quarter to three."}
        - {ar: "المكرو بيطلع السّاعة سبعة.", tr: "il-mikro byiṭla3 is-sā3a sab3a.", en: "The minibus leaves at seven."}
        - {ar: "إذا في عجقة، منوصل السّاعة عشرة.", tr: "ʔiza fī 3ajʔa, mnūṣal is-sā3a 3ašra.", en: "If there's traffic, we get there at ten."}
      fill:
        - {tr: "is-sā3a ___?", answer: "ʔaddēš", en: "What time is it?"}
        - {tr: "tmāne w-___", answer: "rub3", en: "8:15"}
        - {tr: "tis3a ___ rub3", answer: "ʔilla", en: "8:45"}
        - {tr: "is-sā3a ___", answer: "waḥde", en: "one o'clock"}

  - id: L016
    n: 16
    title: {ar: "عَم اِحْكي", tr: "3am-iḥki", en: "I'm talking"}
    scene: "A video call from Paris. Adam's mother catches him at Tēta's, over coffee."
    lines:
      - {who: mama, ar: "ألو، آدَم؟ عَم تِسْمَعْني؟", tr: "ʔalō, ʔādam? 3am-tisma3ni?", lit: "hello, Adam? (now) you-hear-me?", en: "Hello, Adam? Can you hear me?"}
      - {who: adam, ar: "اي ماما، عَم اِسْمَعِك. بَسّ الصّوْت عَم يِقْطَع.", tr: "ʔē māma, 3am-isma3ik. bass iṣ-ṣōt 3am-yiʔṭa3.", lit: "yes mum, (now) I-hear-you. but the-sound (now) it-cuts", en: "Yes, Mum, I can hear you. But the sound keeps cutting out."}
      - {who: mama, ar: "شو عَم تَعْمِل هَلّق؟", tr: "šū 3am-ta3mil hallaʔ?", lit: "what (now) you-do now?", en: "What are you doing right now?"}
      - {who: adam, ar: "عَم اِشْرَب قَهْوة مَع تيتا، وعَم نِحْكي عَنِّك!", tr: "3am-išrab ʔahwe ma3 tēta, w-3am-niḥki 3annik!", lit: "(now) I-drink coffee with grandma, and-(now) we-talk about-you", en: "I'm having coffee with Tēta, and we're talking about you!"}
      - {who: mama, ar: "سَلِّمْلي عَلَيْها كْتير!", tr: "sallimli 3alēha ktīr!", lit: "greet-for-me on-her much", en: "Give her my love!"}
      - {who: teta, ar: "أَهْلين يا بِنْتي! ونَبيل؟ لَيْش ما عَم يِحْكي مَعْنا؟", tr: "ʔahlēn yā binti! w-Nabīl? lēš mā 3am-yiḥki ma3na?", lit: "hello O daughter-my! and-Nabil? why not (now) he-talks with-us?", en: "Hello, dear! And Nabīl? Why isn't he talking to us?"}
      - {who: mama, ar: "نَبيل عَم يِشْتِغِل كْتير هالأَيّام. بَسّ هُوّ مْنيح، وَالله.", tr: "Nabīl 3am-yištiɣil ktīr hal-ʔayyām. bass huwwe mnīḥ, wallāhi.", lit: "Nabil (now) he-works much these-days. but he fine, by-God", en: "Nabīl is working a lot these days. But he's fine, honestly."}
    notes:
      - {line: 1, ar: "عَم تِسْمَعْني؟", tr: "3am-tisma3ni?", topic: grammar, text: "{عَم|3am-} before a verb means 'right now, in progress', like English -ing: {عَم تِسْمَعْني؟|3am-tisma3ni?} 'are you hearing me?'. After 3am- the verb usually drops its b-: {بْتِسْمَع|btisma3} → {عَم تِسْمَع|3am-tisma3}. -ni is 'me' on a verb."}
      - {line: 1, ar: "ألو… ماما", tr: "ʔalō… māma", topic: vocab, text: "{ألو|ʔalō} 'hello' on the phone, from French allô. {ماما|māma} 'Mum', {بابا|bāba} 'Dad'."}
      - {line: 2, ar: "عَم اِسْمَعِك", tr: "3am-isma3ik", topic: grammar, text: "For 'I', the verb after 3am- starts with a vowel: {عَم اِسْمَع|3am-isma3} 'I'm hearing'. -ik is 'you' (to a woman) on a verb, the same ending as on nouns: {بَيْتِك|bētik} 'your house'."}
      - {line: 2, ar: "الصّوْت عَم يِقْطَع", tr: "iṣ-ṣōt 3am-yiʔṭa3", topic: vocab, text: "{صوْت|ṣōt} 'sound, voice'. {قَطَع|ʔaṭa3} 'to cut' (ق said ʔ): {عَم يِقْطَع|3am-yiʔṭa3} 'it keeps cutting out'. 3am- also covers something that keeps happening right now."}
      - {line: 3, ar: "شو عَم تَعْمِل؟", tr: "šū 3am-ta3mil?", topic: grammar, text: "Compare {شو بْتَعْمِل؟|šū bta3mil?} 'what do you do (in general)?' with {شو عَم تَعْمِل؟|šū 3am-ta3mil?} 'what are you doing (now)?'."}
      - {line: 4, ar: "عَم اِشْرَب قَهْوة", tr: "3am-išrab ʔahwe", topic: vocab, text: "{شِرِب|širib} 'to drink'. Coffee, tea and water are 'drunk', and in Syria so is a cigarette: {شِرِب سيكارة|širib sīkāra} 'he smoked a cigarette'."}
      - {line: 4, ar: "عَم نِحْكي عَنِّك", tr: "3am-niḥki 3annik", topic: vocab, text: "{حَكى|ḥaka} 'to talk, to speak': {عَم نِحْكي|3am-niḥki} 'we're talking'. {عَن|3an} 'about' + -ik: {عَنِّك|3annik} 'about you'. {بْتِحْكي عَرَبي؟|btiḥki 3arabi?} 'do you speak Arabic?'."}
      - {line: 5, ar: "سَلِّمْلي عَلَيْها", tr: "sallimli 3alēha", topic: culture, text: "'Greet her for me': how you send your love to someone. {سَلِّم|sallim} 'greet!' + -li 'for me' + {عَلَيْها|3alēha} 'on her'. The usual reply is {بْيوصَل|byūṣal} 'it will arrive'."}
      - {line: 6, ar: "يا بِنْتي", tr: "yā binti", topic: culture, text: "{بِنْتي|binti} 'my daughter': Tēta's warm way to speak to her daughter-in-law. {بِنْت|bint} is also 'girl'."}
      - {line: 6, ar: "لَيْش ما عَم يِحْكي", tr: "lēš mā 3am-yiḥki", topic: grammar, text: "{لَيْش|lēš} 'why' (more in lesson 17). {ما عَم يِحْكي|mā 3am-yiḥki} 'he isn't talking': mā goes before 3am-. {مَعْنا|ma3na} 'with us'."}
      - {line: 7, ar: "هالأَيّام… وَالله", tr: "hal-ʔayyām… wallāhi", topic: vocab, text: "{هالأَيّام|hal-ʔayyām} 'these days': hal- 'this' (lesson 13) + {أَيّام|ʔayyām}, plural of {يوم|yōm} 'day'. {وَالله|wallāhi} 'by God', used all the time to mean 'really, honestly'."}
    sections:
      - title: "Now, or in general?"
        table:
          head: ["", "in general (b-)", "right now (3am-)"]
          rows:
            - ["I drink", "bišrab", "3am-išrab"]
            - ["you talk", "btiḥki", "3am-tiḥki"]
            - ["he works", "byištiɣil", "3am-yištiɣil"]
            - ["we hear", "minisma3", "3am-nisma3"]
        after: "Some Damascenes keep the b- after 3am- (3am-biḥki 'I'm talking'); you will hear both. Negative: mā 3am-iḥki 'I'm not talking'."
    words:
      - {ar: "عم", tr: "3am-", en: "(before a verb) in progress, right now"}
      - {ar: "سمع", tr: "simi3 (bisma3)", en: "to hear, listen"}
      - {ar: "صوت", tr: "ṣōt", en: "sound, voice"}
      - {ar: "قطع", tr: "ʔaṭa3 (byiʔṭa3)", en: "to cut"}
      - {ar: "شرب", tr: "širib (bišrab)", en: "to drink"}
      - {ar: "حكى", tr: "ḥaka (biḥki)", en: "to talk, speak"}
      - {ar: "عن", tr: "3an", en: "about"}
      - {ar: "سلّم على", tr: "sallam 3ala", en: "to greet, send regards to"}
      - {ar: "بنت", tr: "bint", en: "girl; daughter"}
      - {ar: "ليش", tr: "lēš", en: "why"}
      - {ar: "يوم، أيّام", tr: "yōm, ʔayyām", en: "day, days"}
      - {ar: "والله", tr: "wallāhi", en: "really, honestly"}
    practice:
      translate:
        - {ar: "عم احكي مع ماما.", tr: "3am-iḥki ma3 māma.", en: "I'm talking to Mum."}
        - {ar: "شو عم تشرب؟", tr: "šū 3am-tišrab?", en: "What are you drinking?"}
        - {ar: "سامي عم يشتغل.", tr: "Sāmi 3am-yištiɣil.", en: "Sāmi is working."}
        - {ar: "ما عم اسمعك.", tr: "mā 3am-isma3ak.", en: "I can't hear you."}
      fill:
        - {tr: "šū ___ ta3mil?", answer: "3am", en: "What are you doing (now)?"}
        - {tr: "3am-___ ʔahwe.", answer: "išrab", en: "I'm drinking coffee."}
        - {tr: "sallimli ___!", answer: "3alēha", en: "Give her my love!"}
        - {tr: "___ mā 3am-yiḥki?", answer: "lēš", en: "Why isn't he talking?"}

  - id: L017
    n: 17
    title: {ar: "لَيْش؟", tr: "lēš?", en: "Why?"}
    scene: "After the call. Tēta and Adam are alone in the courtyard, and she has questions."
    lines:
      - {who: teta, ar: "لَيْش هَلّق بَسّ يا تيتا؟ عِشْرين سِنة ما شِفْناك!", tr: "lēš hallaʔ bass yā tēta? 3išrīn sine mā šifnāk!", lit: "why now only O grandma? twenty year not we-saw-you", en: "Why only now, my dear? Twenty years we haven't seen you!"}
      - {who: adam, ar: "لَإنّو بابا دايْماً بْيِقول: مو هَلّق، مو هَلّق.", tr: "laʔinno bāba dāyman biʔūl: mū hallaʔ, mū hallaʔ.", lit: "because dad always he-says: not now, not now", en: "Because Dad always says: not now, not now."}
      - {who: teta, ar: "وإيمْت بِدّو يِجي؟", tr: "w-ʔēmat biddo yiji?", lit: "and-when want-his he-comes?", en: "And when does he want to come?"}
      - {who: adam, ar: "ما بَعْرِف... لَمّا يِخْلَص الشُّغِل، بْيِقول.", tr: "mā ba3rif... lamma yixlaṣ iš-šuɣil, biʔūl.", lit: "not I-know... when it-ends the-work, he-says", en: "I don't know... when the work is done, he says."}
      - {who: teta, ar: "الشُّغِل! دايْماً الشُّغِل. وكيف عْرِفْت وَيْن بَيْتْنا؟", tr: "iš-šuɣil! dāyman iš-šuɣil. w-kīf 3rift wēn bētna?", lit: "the-work! always the-work. and-how you-knew where house-our?", en: "Work! Always work. And how did you know where our house was?"}
      - {who: adam, ar: "مِن الصّوَر. بابا عَنْدو صوَر كْتير لَهالبَيْت.", tr: "min iṣ-ṣuwar. bāba 3ando ṣuwar ktīr la-hal-bēt.", lit: "from the-photos. dad at-him photos many to-this-house", en: "From the photos. Dad has lots of photos of this house."}
      - {who: teta, ar: "يَعْني ما نِسي... الحَمْدِلله.", tr: "ya3ni mā nisi... il-ḥamdilla.", lit: "means not he-forgot... the-praise-to-God", en: "So he hasn't forgotten... thank God."}
    notes:
      - {line: 1, ar: "لَيْش… هَلّق بَسّ", tr: "lēš… hallaʔ bass", topic: grammar, text: "{لَيْش|lēš} 'why?'. The answer starts with {لَإنّو|laʔinno} 'because' (line 2). {بَسّ|bass} after a word means 'only': {هَلّق بَسّ|hallaʔ bass} 'only now'; before a clause it is 'but' (lesson 6)."}
      - {line: 1, ar: "عِشْرين سِنة ما شِفْناك", tr: "3išrīn sine mā šifnāk", topic: grammar, text: "{سِنة|sine} 'year', singular after 3išrīn (lesson 13). A length of time placed first means 'for': 'twenty years we haven't seen you'. {شِفْناك|šifnāk} 'we saw you' is {شِفْنا|šifna} 'we saw' + -ak 'you'; endings on verbs come in lesson 26."}
      - {line: 2, ar: "دايْماً بْيِقول", tr: "dāyman biʔūl", topic: vocab, text: "{دايْماً|dāyman} 'always', another word that keeps the MSA ending -an. {قال|ʔāl} 'to say' (ق said ʔ): {بْيِقول|biʔūl} 'he says'. As in {بيحِبّ|biḥibb}, b- and yi- merge."}
      - {line: 3, ar: "إيمْت بِدّو يِجي؟", tr: "ʔēmat biddo yiji?", topic: grammar, text: "{إيمْت|ʔēmat} 'when?'; you will also hear {إيمْتى|ʔēmta}, the usual Lebanese form. {بِدّو|biddo} 'he wants' (bidd + -o 'his'). {يِجي|yiji} 'he comes', the form without b- of {إجا|ʔija} 'to come' (lesson 20)."}
      - {line: 4, ar: "ما بَعْرِف", tr: "mā ba3rif", topic: vocab, text: "{ما بَعْرِف|mā ba3rif} 'I don't know', heard many times a day. For 'I', b- + ʔa3rif gives {بَعْرِف|ba3rif}."}
      - {line: 4, ar: "لَمّا يِخْلَص الشُّغِل", tr: "lamma yixlaṣ iš-šuɣil", topic: grammar, text: "{لَمّا|lamma} 'when' in a statement; the question 'when?' is {إيمْت|ʔēmat}. The verb after lamma has no b-. {خِلِص|xiliṣ} 'to end, be over'; {الشُّغِل|iš-šuɣil} 'work', from the same root as {اِشْتَغَل|ištaɣal} 'to work' (lesson 11)."}
      - {line: 5, ar: "كيف عْرِفْت وَيْن بَيْتْنا؟", tr: "kīf 3rift wēn bētna?", topic: grammar, text: "{كيف|kīf} 'how?' (lesson 2) asks about manner: 'how did you know...?'. {عْرِفْت|3rift} 'you knew, found out', past of {عِرِف|3irif}. A question word can sit inside a sentence: {وَيْن بَيْتْنا|wēn bētna} 'where our house is'. -na 'our'."}
      - {line: 6, ar: "الصّوَر… عَنْدو", tr: "iṣ-ṣuwar… 3ando", topic: grammar, text: "{صوَر|ṣuwar} 'photos', plural of {صورة|ṣūra} (lesson 4): many plurals change the vowels inside the word instead of adding an ending. {عَنْدو|3ando} 'he has' (3and + -o 'his')."}
      - {line: 7, ar: "ما نِسي", tr: "mā nisi", topic: vocab, text: "{نِسي|nisi} 'to forget': {ما نِسي|mā nisi} 'he hasn't forgotten'. Verbs ending in a vowel, like nisi and {حَكى|ḥaka}, have -ī- before the past endings: {نْسيت|nsīt} 'I forgot', {حْكيت|ḥkīt} 'I talked'."}
    sections:
      - title: "Question words"
        table:
          head: ["", "Shami", ""]
          rows:
            - ["what", "šū", "شو"]
            - ["who", "mīn", "مين"]
            - ["where", "wēn", "وَيْن"]
            - ["where from", "mnēn", "مْنَيْن"]
            - ["when", "ʔēmat", "إيمْت"]
            - ["why", "lēš", "لَيْش"]
            - ["how", "kīf", "كيف"]
            - ["how much", "ʔaddēš", "أَدّيش"]
            - ["how many", "kam (+ singular)", "كَم"]
        after: "Statements use other words: laʔinno 'because', lamma 'when', ʔiza 'if'."
    words:
      - {ar: "ليش", tr: "lēš", en: "why"}
      - {ar: "لإنّو", tr: "laʔinno", en: "because"}
      - {ar: "إيمت", tr: "ʔēmat", en: "when?"}
      - {ar: "لمّا", tr: "lamma", en: "when (statement)"}
      - {ar: "سنة", tr: "sine", en: "year"}
      - {ar: "دايماً", tr: "dāyman", en: "always"}
      - {ar: "قال", tr: "ʔāl (biʔūl)", en: "to say"}
      - {ar: "خلص", tr: "xiliṣ", en: "to end, be over"}
      - {ar: "شغل", tr: "šuɣil", en: "work"}
      - {ar: "عرف", tr: "3irif (ba3rif)", en: "to know"}
      - {ar: "صورة، صور", tr: "ṣūra, ṣuwar", en: "photo, photos"}
      - {ar: "نسي", tr: "nisi", en: "to forget"}
    practice:
      translate:
        - {ar: "ليش ما بتحكي؟", tr: "lēš mā btiḥki?", en: "Why don't you say anything?"}
        - {ar: "إيمت بدّك تروح؟", tr: "ʔēmat biddak trūḥ?", en: "When do you want to go?"}
        - {ar: "لمّا يخلص الشّغل، منروح عالسّوق.", tr: "lamma yixlaṣ iš-šuɣil, minrūḥ 3as-sūʔ.", en: "When work is over, we'll go to the souk."}
        - {ar: "ما بعرف ليش.", tr: "mā ba3rif lēš.", en: "I don't know why."}
      fill:
        - {tr: "___ hallaʔ bass?", answer: "lēš", en: "Why only now?"}
        - {tr: "___ bāba biʔūl: mū hallaʔ.", answer: "laʔinno", en: "Because Dad says: not now."}
        - {tr: "___ biddo yiji?", answer: "ʔēmat", en: "When does he want to come?"}
        - {tr: "___ yixlaṣ iš-šuɣil", answer: "lamma", en: "when the work is over"}

  - id: L018
    n: 18
    title: {ar: "تَعا لَهَوْن", tr: "ta3a la-hōn", en: "Come here"}
    scene: "Friday morning in Umm Sāmi's kitchen. Everyone is put to work."
    lines:
      - {who: umm, ar: "آدَم، تَعا لَهَوْن! خود هالبَصَل.", tr: "ʔādam, ta3a la-hōn! xōd hal-baṣal.", lit: "Adam, come to-here! take this-onion", en: "Adam, come here! Take these onions."}
      - {who: adam, ar: "وشو بَعْمِل؟", tr: "w-šū ba3mil?", lit: "and-what I-do?", en: "And what do I do?"}
      - {who: umm, ar: "اِقْطَعو صْغير. وإنْتي يا لينا، جيبي البَنَدورة!", tr: "ʔiʔṭa3o zɣīr. w-ʔinti yā Līna, jībi l-banadōra!", lit: "cut-it small. and-you O Lina, bring the-tomatoes", en: "Chop them small. And you, Līna, bring the tomatoes!"}
      - {who: lina, ar: "حاضِر! ... آدَم، لا تِبْكي!", tr: "ḥāḍir! ... ʔādam, lā tibki!", lit: "ready! ... Adam, don't you-cry", en: "Right away! ... Adam, don't cry!"}
      - {who: adam, ar: "ما عَم اِبْكي! هاد البَصَل!", tr: "mā 3am-ibki! hād il-baṣal!", lit: "not (now) I-cry! this the-onion", en: "I'm not crying! It's the onions!"}
      - {who: umm, ar: "يَلّا شَباب، تَعالو كِلو! بَسّ لا تِحْكو كْتير.", tr: "yalla šabāb, ta3ālu kilu! bass lā tiḥku ktīr.", lit: "come-on guys, come eat! but don't you(pl)-talk much", en: "Come on, everyone, come and eat! Just don't talk too much."}
      - {who: teta, ar: "خَلّيهُن يِحْكو! الحَكي حِلو.", tr: "xallīhun yiḥku! il-ḥaki ḥilu.", lit: "let-them they-talk! the-talking nice", en: "Let them talk! Talking is nice."}
    notes:
      - {line: 1, ar: "تَعا لَهَوْن", tr: "ta3a la-hōn", topic: grammar, text: "An order. {تَعا|ta3a} 'come!' to a man, {تَعي|ta3i} to a woman, {تَعالو|ta3ālu} to several (line 6). {لَهَوْن|la-hōn} 'to here': la- 'to' + {هَوْن|hōn}."}
      - {line: 1, ar: "خود هالبَصَل", tr: "xōd hal-baṣal", topic: grammar, text: "{خود|xōd} 'take!', to a woman {خِدي|xidi}, to several {خِدو|xidu}. {بَصَل|baṣal} 'onions': like many foods, a collective word for onion in general (lesson 22)."}
      - {line: 2, ar: "شو بَعْمِل؟", tr: "šū ba3mil?", topic: grammar, text: "'What do I do?': {بَعْمِل|ba3mil} is b- + ʔa3mil, like {بَعْرِف|ba3rif} (lesson 17). The plain present often does the work of English 'shall I'."}
      - {line: 3, ar: "اِقْطَعو صْغير", tr: "ʔiʔṭa3o zɣīr", topic: grammar, text: "Most orders are the 'you' form without its t-: {تِقْطَع|tiʔṭa3} 'you cut' → {اِقْطَع|ʔiʔṭa3} 'cut!'. -o is 'it, him': {اِقْطَعو|ʔiʔṭa3o} 'cut it'. {صْغير|zɣīr} 'small': written like MSA {صَغير|ṣaɣīr}, but said with z."}
      - {line: 3, ar: "جيبي البَنَدورة", tr: "jībi l-banadōra", topic: vocab, text: "{جاب|jāb} 'to bring': {جيب|jīb} 'bring!', to a woman {جيبي|jībi}. {بَنَدورة|banadōra} 'tomatoes', from Italian pomodoro."}
      - {line: 4, ar: "حاضِر", tr: "ḥāḍir", topic: culture, text: "{حاضِر|ḥāḍir} 'ready': the polite yes to a request from someone older, like 'right away'."}
      - {line: 4, ar: "لا تِبْكي", tr: "lā tibki", topic: grammar, text: "'Don't…!': {لا|lā} + the 'you' form without b-: {لا تِبْكي|lā tibki} 'don't cry!'. A negative order always takes lā, never mā. {بِكي|biki} 'to cry'."}
      - {line: 5, ar: "ما عَم اِبْكي", tr: "mā 3am-ibki", topic: grammar, text: "'I'm not crying': {ما|mā} before {عَم|3am-} (lesson 16). {هاد البَصَل|hād il-baṣal} 'it's the onions', literally 'this (is) the onions'."}
      - {line: 6, ar: "تَعالو كِلو", tr: "ta3ālu kilu", topic: grammar, text: "To several people, orders end in -u: {تَعالو|ta3ālu} 'come!', {كِلو|kilu} 'eat!' (to one man {كول|kōl}, to a woman {كِلي|kili}). {لا تِحْكو|lā tiḥku} 'don't talk' (to several)."}
      - {line: 7, ar: "خَلّيهُن يِحْكو", tr: "xallīhun yiḥku", topic: vocab, text: "{خَلّي|xalli} 'let!' + -hun 'them': 'let them talk'. {الحَكي|il-ḥaki} 'talking, talk', from {حَكى|ḥaka} (lesson 16)."}
    sections:
      - title: "Orders"
        table:
          head: ["", "to a man", "to a woman", "to several"]
          rows:
            - ["come", "ta3a", "ta3i", "ta3ālu"]
            - ["take", "xōd", "xidi", "xidu"]
            - ["eat", "kōl", "kili", "kilu"]
            - ["bring", "jīb", "jībi", "jību"]
            - ["go", "rūḥ", "rūḥi", "rūḥu"]
            - ["cut", "ʔiʔṭa3", "ʔiʔṭa3i", "ʔiʔṭa3u"]
        after: "'Don't' is lā + the 'you' form: lā tiḥki (to a man or a woman), lā tiḥku (to several). tfaḍḍal, tfaḍḍali, tfaḍḍalu (lesson 2) are orders too."
    words:
      - {ar: "تعا", tr: "ta3a", en: "come! (irregular)"}
      - {ar: "أخد، خود", tr: "ʔaxad, xōd", en: "to take, take!"}
      - {ar: "بصل", tr: "baṣal", en: "onions"}
      - {ar: "صغير", tr: "zɣīr", en: "small"}
      - {ar: "جاب", tr: "jāb (bjīb)", en: "to bring"}
      - {ar: "بندورة", tr: "banadōra", en: "tomatoes"}
      - {ar: "حاضر", tr: "ḥāḍir", en: "right away, at your service"}
      - {ar: "بكي", tr: "biki (bibki)", en: "to cry"}
      - {ar: "كول", tr: "kōl", en: "eat!"}
      - {ar: "خلّي", tr: "xalli", en: "let!"}
      - {ar: "شباب", tr: "šabāb", en: "young people; guys"}
      - {ar: "حكي", tr: "ḥaki", en: "talk, talking"}
    practice:
      translate:
        - {ar: "تعي لهون يا لينا!", tr: "ta3i la-hōn yā Līna!", en: "Come here, Līna!"}
        - {ar: "خود قهوة!", tr: "xōd ʔahwe!", en: "Have a coffee!"}
        - {ar: "لا تروح لحالك.", tr: "lā trūḥ la-ḥālak.", en: "Don't go on your own."}
        - {ar: "جيبو الكنافة!", tr: "jību l-knāfe!", en: "Bring the knāfe! (to several)"}
      fill:
        - {tr: "___ la-hōn! (to a man)", answer: "ta3a", en: "Come here!"}
        - {tr: "lā ___!", answer: "tibki", en: "Don't cry!"}
        - {tr: "___ l-banadōra! (to a woman)", answer: "jībi", en: "Bring the tomatoes!"}
        - {tr: "yalla, ___! (to several)", answer: "kilu", en: "Come on, eat!"}

  - id: L019
    n: 19
    title: {ar: "رَح نْروح", tr: "raḥ nrūḥ", en: "We're going to go"}
    scene: "Thursday evening on the balcony. The cousins plan the weekend."
    lines:
      - {who: sami, ar: "بُكْرا الجُمْعة. شو رَح نَعْمِل؟", tr: "bukra il-jum3a. šū raḥ na3mil?", lit: "tomorrow the-Friday. what going we-do?", en: "Tomorrow's Friday. What are we going to do?"}
      - {who: lina, ar: "نْروح عَبْلودان؟ الهَوا هْنيك طَيِّب.", tr: "nrūḥ 3a-Blūdān? il-hawa hnīk ṭayyib.", lit: "we-go to-Bloudan? the-air there good", en: "Shall we go to Bloudan? The air's nice up there."}
      - {who: sami, ar: "لأ، بُكْرا رَح يْكون في عَجْقة كْتير. خَلّينا نْروح السَّبْت.", tr: "laʔ, bukra raḥ ykūn fī 3ajʔa ktīr. xallīna nrūḥ is-sabt.", lit: "no, tomorrow going it-be there-is jam much. let-us we-go the-Saturday", en: "No, tomorrow there'll be loads of traffic. Let's go on Saturday."}
      - {who: adam, ar: "السَّبْت رَح اِحْكي مَع بابا عَالفيدْيو.", tr: "is-sabt raḥ iḥki ma3 bāba 3al-vīdyo.", lit: "the-Saturday going I-talk with dad on-the-video", en: "On Saturday I'm going to talk to Dad on video."}
      - {who: lina, ar: "وَالله؟ أَخيراً! رَح يِحْكي مَعَك؟", tr: "wallāhi? ʔaxīran! raḥ yiḥki ma3ak?", lit: "by-God? finally! going he-talks with-you?", en: "Really? Finally! He's going to talk to you?"}
      - {who: adam, ar: "اي، بَعَتْلي رِسالة اليوم.", tr: "ʔē, ba3atli risāle il-yōm.", lit: "yes, he-sent-me message today", en: "Yes, he sent me a message today."}
      - {who: sami, ar: "طَيِّب، مِنْروح عَبْلودان يوم الأَحَد. رَح تْحِبّا كْتير!", tr: "ṭayyib, minrūḥ 3a-Blūdān yōm il-ʔaḥad. raḥ tḥibba ktīr!", lit: "good, we-go to-Bloudan day the-Sunday. going you-love-her much", en: "OK, we'll go to Bloudan on Sunday. You're going to love it!"}
    notes:
      - {line: 1, ar: "بُكْرا الجُمْعة", tr: "bukra il-jum3a", topic: culture, text: "{بُكْرا|bukra} 'tomorrow'. {الجُمْعة|il-jum3a} 'Friday', the weekly day off in Syria and the day of the midday prayer; Saturday is a day off for many too."}
      - {line: 1, ar: "شو رَح نَعْمِل؟", tr: "šū raḥ na3mil?", topic: grammar, text: "{رَح|raḥ} + the verb without b- = the future: {رَح نَعْمِل|raḥ na3mil} 'we're going to do', {رَح اِحْكي|raḥ iḥki} 'I'm going to talk' (line 4). raḥ never changes."}
      - {line: 2, ar: "نْروح عَبْلودان؟", tr: "nrūḥ 3a-Blūdān?", topic: grammar, text: "The 'we' form without b-, asked as a question, is a suggestion: {نْروح؟|nrūḥ?} 'shall we go?'. {خَلّينا نْروح|xallīna nrūḥ} (line 3) 'let's go' is firmer: literally 'let us go'."}
      - {line: 2, ar: "بْلودان… الهَوا طَيِّب", tr: "Blūdān… il-hawa ṭayyib", topic: culture, text: "{بْلودان|Blūdān}: a mountain resort about an hour from Damascus, where families go for cool air in summer. {الهَوا|il-hawa} 'the air', {طَيِّب|ṭayyib} 'good, nice', and 'OK' (line 7)."}
      - {line: 3, ar: "رَح يْكون في", tr: "raḥ ykūn fī", topic: grammar, text: "'There will be': {في|fī} 'there is' (lesson 6) with {رَح يْكون|raḥ ykūn} 'it will be' in front. {كان|kān} 'to be' comes in lesson 29."}
      - {line: 3, ar: "السَّبْت", tr: "is-sabt", topic: vocab, text: "Days take the article: {السَّبْت|is-sabt} 'Saturday'. 'On Saturday' needs no preposition, or uses {يوم|yōm} 'day': {يوم الأَحَد|yōm il-ʔaḥad} 'on Sunday' (line 7). The week is below the dialogue."}
      - {line: 4, ar: "عَالفيدْيو", tr: "3al-vīdyo", topic: vocab, text: "{عَالفيدْيو|3al-vīdyo} 'on video', with 3a- 'on' + il-. Phones, video and the internet all borrow European words: {موبايل|mobāyl} 'mobile', {نِتّ|nett} 'internet'."}
      - {line: 5, ar: "أَخيراً", tr: "ʔaxīran", topic: vocab, text: "{أَخيراً|ʔaxīran} 'finally, at last', another -an word from MSA. {وَالله؟|wallāhi?} as a question: 'really?'."}
      - {line: 6, ar: "بَعَتْلي رِسالة", tr: "ba3atli risāle", topic: grammar, text: "{بَعَت|ba3at} 'to send': {بَعَتْلي|ba3atli} 'he sent me', with -li 'to me' glued on, as in {كَتَبْتِلّو|katabtillo} (lesson 12). {رِسالة|risāle} 'message, letter'."}
      - {line: 7, ar: "مِنْروح… رَح تْحِبّا", tr: "minrūḥ… raḥ tḥibba", topic: grammar, text: "The plain present also covers plans already decided: {مِنْروح يوم الأَحَد|minrūḥ yōm il-ʔaḥad} 'we're going on Sunday'. {رَح تْحِبّا|raḥ tḥibba} 'you'll love it': tḥibb + -a 'her, it' (town names are feminine)."}
    sections:
      - title: "The week"
        table:
          head: ["", "Shami", ""]
          rows:
            - ["Sunday", "il-ʔaḥad", "الأَحَد"]
            - ["Monday", "it-tanēn", "التَّنين"]
            - ["Tuesday", "it-talāta", "التَّلاتا"]
            - ["Wednesday", "il-ʔarba3a", "الأَرْبْعا"]
            - ["Thursday", "il-xamīs", "الخَميس"]
            - ["Friday", "il-jum3a", "الجُمْعة"]
            - ["Saturday", "is-sabt", "السَّبْت"]
        after: "The week starts on Sunday: il-ʔaḥad comes from 'one', it-tanēn from 'two', on to il-xamīs, 'five'. Also: il-yōm 'today', bukra 'tomorrow', ba3d bukra 'the day after tomorrow', mbāriḥ 'yesterday'."
    words:
      - {ar: "بكرا", tr: "bukra", en: "tomorrow"}
      - {ar: "الجمعة", tr: "il-jum3a", en: "Friday"}
      - {ar: "رح", tr: "raḥ", en: "(future) going to, will"}
      - {ar: "هوا", tr: "hawa", en: "air; weather"}
      - {ar: "طيّب", tr: "ṭayyib", en: "good, nice; OK"}
      - {ar: "يكون", tr: "ykūn", en: "(to) be (future, without b-)"}
      - {ar: "خلّينا", tr: "xallīna", en: "let's"}
      - {ar: "السّبت", tr: "is-sabt", en: "Saturday"}
      - {ar: "أخيراً", tr: "ʔaxīran", en: "finally"}
      - {ar: "بعت", tr: "ba3at", en: "to send"}
      - {ar: "رسالة", tr: "risāle", en: "message, letter"}
      - {ar: "يوم", tr: "yōm", en: "day"}
    practice:
      translate:
        - {ar: "رح روح عالجامعة بكرا.", tr: "raḥ rūḥ 3al-jām3a bukra.", en: "I'm going to go to the university tomorrow."}
        - {ar: "شو رح تعمل السّبت؟", tr: "šū raḥ ta3mil is-sabt?", en: "What are you going to do on Saturday?"}
        - {ar: "نشرب قهوة؟", tr: "nišrab ʔahwe?", en: "Shall we have a coffee?"}
        - {ar: "سامي رح يحكي مع أبوه.", tr: "Sāmi raḥ yiḥki ma3 ʔabū.", en: "Sāmi is going to talk to his father."}
      fill:
        - {tr: "šū ___ na3mil bukra?", answer: "raḥ", en: "What are we going to do tomorrow?"}
        - {tr: "___ nrūḥ is-sabt.", answer: "xallīna", en: "Let's go on Saturday."}
        - {tr: "bukra ___.", answer: "il-jum3a", en: "Tomorrow is Friday."}
        - {tr: "ba3atli ___.", answer: "risāle", en: "He sent me a message."}

  - id: L020
    n: 20
    title: {ar: "أَكَلْنا", tr: "ʔakalna", en: "We ate"}
    scene: "Friday lunch is over. The whole family sits back from the table."
    lines:
      - {who: umm, ar: "كيف الأَكِل؟ أَكَلْتو مْنيح؟", tr: "kīf il-ʔakil? ʔakaltu mnīḥ?", lit: "how the-food? you(pl)-ate well?", en: "How was the food? Did you eat well?"}
      - {who: adam, ar: "أَكَلْنا كْتير! أنا أَكَلْت تْلات صْحون فَتّة.", tr: "ʔakalna ktīr! ʔana ʔakalt tlat ṣḥūn fatte.", lit: "we-ate much! I I-ate three plates fatteh", en: "We ate loads! I had three plates of fatteh."}
      - {who: abu, ar: "وسامي إجا مِتْأَخِّر، وأَكَل أَكْتَر مِن الكِلّ!", tr: "w-Sāmi ʔija mitʔaxxir, w-ʔakal ʔaktar min il-kill!", lit: "and-Sami he-came late, and-he-ate more than the-all", en: "And Sāmi came late and ate more than anyone!"}
      - {who: sami, ar: "لَإنّو إجيت جوعان! أَخَدْت المِكْرو، وصار في عَجْقة.", tr: "laʔinno ʔijīt jū3ān! ʔaxadt il-mikro, w-ṣār fī 3ajʔa.", lit: "because I-came hungry! I-took the-minibus, and-became there-is jam", en: "Because I came hungry! I took the minibus, and there was a jam."}
      - {who: lina, ar: "وإنْتَ يا آدَم؟ إجيت مِن باريس، أَخَدْت أوضِة عَمّي، وهَلّق أَكَلْت أَكِل تيتا. صِرْت شامي!", tr: "w-ʔinte yā ʔādam? ʔijīt min Bārīs, ʔaxadt ʔūḍit 3ammi, w-hallaʔ ʔakalt ʔakil tēta. ṣirt šāmi!", lit: "and-you O Adam? you-came from Paris, you-took room uncle-my, and-now you-ate food grandma. you-became Damascene", en: "And you, Adam? You came from Paris, you took my uncle's room, and now you've eaten Tēta's cooking. You've become a Damascene!"}
      - {who: teta, ar: "لِسّا مو شامي. بَسّ إذا بْياكُل هَيْك كِلّ جُمْعة...", tr: "lissa mū šāmi. bass ʔiza byākul hēk kill jum3a...", lit: "still not Damascene. but if he-eats like-this every Friday...", en: "Not a Damascene yet. But if he eats like this every Friday..."}
      - {who: adam, ar: "كِلّ جُمْعة! أَكيد!", tr: "kill jum3a! ʔakīd!", lit: "every Friday! sure", en: "Every Friday! Definitely!"}
    notes:
      - {line: 1, ar: "أَكَلْتو مْنيح؟", tr: "ʔakaltu mnīḥ?", topic: grammar, text: "{أَكَل|ʔakal} 'to eat' has a regular past: {أَكَلْت|ʔakalt} 'I ate', {أَكَلْتو|ʔakaltu} 'you (pl) ate', {أَكَلْنا|ʔakalna} 'we ate'. Its present is the special part (table below). {الأَكِل|il-ʔakil} 'food, the meal'."}
      - {line: 2, ar: "تْلات صْحون فَتّة", tr: "tlat ṣḥūn fatte", topic: grammar, text: "From 3 to 10, the number takes a short form and the noun is plural: {تْلاتة|tlāte} → {تْلات صْحون|tlat ṣḥūn} 'three plates' ({صَحْن|ṣaḥn} 'plate'). Compare 'from 11, singular' (lesson 13)."}
      - {line: 2, ar: "فَتّة", tr: "fatte", topic: culture, text: "{فَتّة|fatte}: toasted bread under chickpeas, yoghurt and tahini, topped with pine nuts and hot butter. A Damascus breakfast and Friday dish."}
      - {line: 3, ar: "إجا مِتْأَخِّر", tr: "ʔija mitʔaxxir", topic: vocab, text: "{إجا|ʔija} 'he came', {مِتْأَخِّر|mitʔaxxir} 'late'. {أَكْتَر مِن الكِلّ|ʔaktar min il-kill} 'more than everyone': {أَكْتَر|ʔaktar} 'more', {الكِلّ|il-kill} 'everybody'."}
      - {line: 4, ar: "إجيت جوعان", tr: "ʔijīt jū3ān", topic: grammar, text: "{إجا|ʔija} 'to come' ends in a vowel, so its past goes like {نِسي|nisi} (lesson 17): {إجيت|ʔijīt} 'I came, you came', {إجِت|ʔijit} 'she came', {إجينا|ʔijīna} 'we came'. An adjective after the verb says how you came: 'I came hungry'."}
      - {line: 4, ar: "أَخَدْت… صار في", tr: "ʔaxadt… ṣār fī", topic: grammar, text: "{أَخَد|ʔaxad} 'to take': past {أَخَدْت|ʔaxadt}. Like ʔakal, its present drops the hamza: {باخُد|bāxud} 'I take'. {صار|ṣār} 'to become, to happen': {صار في عَجْقة|ṣār fī 3ajʔa} 'a jam built up'; {صِرْت شامي|ṣirt šāmi} 'you've become a Damascene' (line 5), with ā shortened as in riḥt."}
      - {line: 5, ar: "أوضِة عَمّي", tr: "ʔūḍit 3ammi", topic: culture, text: "Adam's father is Līna's {عَمّ|3amm}, her father's brother, so she says 'my uncle's room'. For Tēta it was 'your father's room' (lesson 3)."}
      - {line: 6, ar: "لِسّا مو شامي", tr: "lissa mū šāmi", topic: vocab, text: "{لِسّا|lissa} 'still'; with a negative, 'not yet'. {هَيْك|hēk} 'like this, so'. {بْياكُل|byākul} 'he eats', the present of ʔakal."}
      - {line: 7, ar: "أَكيد", tr: "ʔakīd", topic: vocab, text: "{أَكيد|ʔakīd} 'sure, definitely'. {كِلّ جُمْعة|kill jum3a} 'every Friday': {كِلّ|kill} + a noun without the article means 'every'."}
    sections:
      - title: "Three verbs to learn by heart"
        table:
          head: ["", "eat", "take", "come"]
          rows:
            - ["I (past)", "ʔakalt", "ʔaxadt", "ʔijīt"]
            - ["he (past)", "ʔakal", "ʔaxad", "ʔija"]
            - ["she (past)", "ʔakalit", "ʔaxadit", "ʔijit"]
            - ["I (present)", "bākul", "bāxud", "biji"]
            - ["he (present)", "byākul", "byāxud", "byiji"]
            - ["we (present)", "mnākul", "mnāxud", "mniji"]
            - ["order (m)", "kōl", "xōd", "ta3a"]
    words:
      - {ar: "أكل", tr: "ʔakil", en: "food"}
      - {ar: "صحن، صحون", tr: "ṣaḥn, ṣḥūn", en: "plate, plates"}
      - {ar: "فتّة", tr: "fatte", en: "fatteh"}
      - {ar: "إجا", tr: "ʔija (byiji)", en: "to come"}
      - {ar: "متأخّر", tr: "mitʔaxxir", en: "late"}
      - {ar: "أكتر", tr: "ʔaktar", en: "more"}
      - {ar: "الكلّ", tr: "il-kill", en: "everybody"}
      - {ar: "صار", tr: "ṣār", en: "to become; to happen"}
      - {ar: "لسّا", tr: "lissa", en: "still; (not) yet"}
      - {ar: "هيك", tr: "hēk", en: "like this, so"}
      - {ar: "أكيد", tr: "ʔakīd", en: "sure, definitely"}
    practice:
      translate:
        - {ar: "أكلت فتّة مبارح.", tr: "ʔakalt fatte mbāriḥ.", en: "I had fatteh yesterday."}
        - {ar: "إيمت إجيت؟", tr: "ʔēmat ʔijīt?", en: "When did you come?"}
        - {ar: "سامي بياخد المكرو كلّ يوم.", tr: "Sāmi byāxud il-mikro kill yōm.", en: "Sāmi takes the minibus every day."}
        - {ar: "لسّا ما أكلت.", tr: "lissa mā ʔakalt.", en: "I haven't eaten yet."}
      fill:
        - {tr: "niḥna ___ ktīr.", answer: "ʔakalna", en: "We ate a lot."}
        - {tr: "Sāmi ___ mitʔaxxir.", answer: "ʔija", en: "Sāmi came late."}
        - {tr: "___ il-mikro.", answer: "ʔaxadt", en: "I took the minibus."}
        - {tr: "byākul hēk ___ jum3a.", answer: "kill", en: "He eats like this every Friday."}

  - id: L021
    n: 21
    review: true
    title: {ar: "مُراجَعة", tr: "murāja3a", en: "Revision 3"}
    scene: "Saturday, ten o'clock. The video call with Dad, at last."
    sections:
      - title: "One verb, five ways"
        text: "ḥaka 'to talk', through everything you know:"
        table:
          head: ["", "Shami", ""]
          rows:
            - ["I talk (in general)", "biḥki", "بِحْكي"]
            - ["I'm talking (now)", "3am-iḥki", "عَم اِحْكي"]
            - ["I'm going to talk", "raḥ iḥki", "رَح اِحْكي"]
            - ["I talked", "ḥkīt", "حْكيت"]
            - ["talk! (m / f / pl)", "ʔiḥki / ʔiḥki / ʔiḥku", "اِحْكي / اِحْكو"]
            - ["don't talk!", "lā tiḥki / lā tiḥku", "لا تِحْكي / لا تِحْكو"]
      - title: "Questions and answers"
        text: "šū, mīn, wēn, mnēn, ʔēmat, lēš, kīf, ʔaddēš, kam. lēš? → laʔinno… 'because'. ʔēmat? → lamma… 'when'. Statements: ʔiza 'if', ʔaw 'or'."
      - title: "Time"
        text: "is-sā3a ʔaddēš? — is-sā3a tmāne w-rub3 / w-tilt / w-nuṣṣ / tis3a ʔilla rub3. Days take the article: is-sabt, yōm il-ʔaḥad."
      - title: "Three verbs by heart"
        text: "ʔakal, ʔaxad, ʔija: past ʔakalt, ʔaxadt, ʔijīt; present bākul, bāxud, biji; orders kōl, xōd, ta3a."
    lines:
      - {who: baba, ar: "ألو؟ آدَم؟ عَم تِسْمَعْني؟", tr: "ʔalō? ʔādam? 3am-tisma3ni?", lit: "hello? Adam? (now) you-hear-me?", en: "Hello? Adam? Can you hear me?"}
      - {who: adam, ar: "اي بابا! عَم اِسْمَعَك مْنيح. كيفَك؟", tr: "ʔē bāba! 3am-isma3ak mnīḥ. kīfak?", lit: "yes dad! (now) I-hear-you well. how-you?", en: "Yes, Dad! I can hear you fine. How are you?"}
      - {who: baba, ar: "مْنيح، الحَمْدِلله. وإنْتَ؟ كيف الشّام؟ كيف تيتا؟", tr: "mnīḥ, il-ḥamdilla. w-ʔinte? kīf iš-Šām? kīf tēta?", lit: "fine, praise-God. and-you? how the-Sham? how grandma?", en: "Fine, thank God. And you? How's Damascus? How's Tēta?"}
      - {who: adam, ar: "تيتا مْنيحة. بَسّ كِلّ يوم بْتِقول: إيمْت رَح يِجي نَبيل؟", tr: "tēta mnīḥa. bass kill yōm btʔūl: ʔēmat raḥ yiji Nabīl?", lit: "grandma fine. but every day she-says: when going he-comes Nabil?", en: "Tēta's fine. But every day she says: when is Nabīl going to come?"}
      - {who: baba, ar: "رَح اِجي، أَكيد. بَسّ مو هَلّق.", tr: "raḥ iji, ʔakīd. bass mū hallaʔ.", lit: "going I-come, sure. but not now", en: "I'll come, of course. But not now."}
      - {who: adam, ar: "دايْماً «مو هَلّق»! لَيْش، بابا؟", tr: "dāyman «mū hallaʔ»! lēš, bāba?", lit: "always not now! why, dad?", en: "Always 'not now'! Why, Dad?"}
      - {who: baba, ar: "الشُّغِل، يا اِبْني... يَلّا، سَلِّمْلي عَلَيْها.", tr: "iš-šuɣil, yā ʔibni... yalla, sallimli 3alēha.", lit: "the-work, O son-my... come-on, greet-for-me on-her", en: "Work, son... Right, give her my love."}
      - {who: adam, ar: "بابا؟ بابا؟ ... الصّوْت عَم يِقْطَع.", tr: "bāba? bāba? ... iṣ-ṣōt 3am-yiʔṭa3.", lit: "dad? dad? ... the-sound (now) it-cuts", en: "Dad? Dad? ... The sound is cutting out."}
    words:
      - {ar: "مْنَين", tr: "mnēn", en: "where from"}
    practice:
      translate:
        - {ar: "السّاعة أدّيش رح تيجي؟", tr: "is-sā3a ʔaddēš raḥ tiji?", en: "What time are you going to come?"}
        - {ar: "عم نحكي عنّك!", tr: "3am-niḥki 3annak!", en: "We're talking about you!"}
        - {ar: "لا تاكل كتير!", tr: "lā tākul ktīr!", en: "Don't eat too much!"}
        - {ar: "ليش ما إجيت مبارح؟", tr: "lēš mā ʔijīt mbāriḥ?", en: "Why didn't you come yesterday?"}
      fill:
        - {tr: "raḥ ___ bukra. (I come)", answer: "iji", en: "I'll come tomorrow."}
        - {tr: "___ 3am-tiḥki? (who)", answer: "mīn", en: "Who's talking?"}
        - {tr: "is-sā3a tlāte w-___ (3:30)", answer: "nuṣṣ", en: "half past three"}
        - {tr: "lā ___ ktīr! (to several)", answer: "tiḥku", en: "Don't talk too much!"}

  - id: B03
    n: B3
    bridge: true
    title: {ar: "الكِلْمات الصْغيرة", tr: "il-kilmāt iz-zɣīre", en: "Bridge 3 · Little words"}
    scene: "Pronouns, 'this', question words, 'because', 'when', the future: the small words are where Shami and MSA differ most. Here are this week's sentences with their MSA version."
    sides:
      - ref: [L015, 1]
        msa: {ar: "يا سامي، كَمِ السّاعَةُ؟", tr: "yā Sāmī, kami s-sā3atu?"}
        hl:
          - ["السّاعة أَدّيش", "is-sā3a ʔaddēš", "كَمِ السّاعَةُ", "kami s-sā3atu", q, "'What time is it?': MSA asks 'how many (is) the hour?', with kam first. Shami uses ʔaddēš 'how much', and can put it last."]
      - ref: [L015, 4]
        msa: {ar: "التّاسِعَةُ إِلّا رُبْعًا، إِذا لَمْ يَكُنْ هُناكَ زِحامٌ.", tr: "at-tāsi3atu ʔillā rub3an, ʔidhā lam yakun hunāka ziḥāmun."}
        hl:
          - ["تِسْعة", "tis3a", "التّاسِعَةُ", "at-tāsi3atu", words, "MSA tells the time with the ordinal, 'the ninth (hour)': at-tāsi3a. Shami uses the plain number."]
          - ["إذا", "ʔiza", "إِذا", "ʔidhā", conj, "'If': the same word. Shami says ذ as z here, the learned way (Bridge 1)."]
          - ["ما في", "mā fī", "لَمْ يَكُنْ هُناكَ", "lam yakun hunāka", words, "'There's no...': Shami mā fī. MSA says 'there was not', lam yakun, with hunāka 'there'. More in Bridge 4."]
      - ref: [L016, 3]
        msa: {ar: "ماذا تَفْعَلُ الآنَ؟", tr: "mādhā taf3alu l-ʔāna?"}
        hl:
          - ["شو", "šū", "ماذا", "mādhā", q, "'What': šū goes with anything. MSA uses mādhā before a verb and mā before a noun: mā hādhā? 'what is this?'."]
          - ["عَم تَعْمِل", "3am-ta3mil", "تَفْعَلُ", "taf3alu", words, "MSA has no 'right now' marker: the plain present taf3alu means both 'you do' and 'you are doing'. Shami adds 3am-."]
      - ref: [L016, 4]
        msa: {ar: "أَشْرَبُ القَهْوَةَ مَعَ جَدَّتي، وَنَتَحَدَّثُ عَنْكِ!", tr: "ʔašrabu l-qahwata ma3a jaddatī, wa-nataḥaddathu 3anki!"}
        hl:
          - ["عَنِّك", "3annik", "عَنْكِ", "3anki", pron, "'About you' (to a woman): the same little word 3an, the same ending, -ki in MSA, -ik in Shami, which also doubles the n."]
          - ["نِحْكي", "niḥki", "نَتَحَدَّثُ", "nataḥaddathu", words, "'We talk': Shami ḥaka; MSA taḥaddatha. MSA ḥakā exists, but means 'to tell (a story)'."]
      - ref: [L016, 6]
        msa: {ar: "أَهْلًا يا ابْنَتي! وَنَبيلٌ؟ لِماذا لا يَتَحَدَّثُ مَعَنا؟", tr: "ʔahlan yā bnatī! wa-Nabīlun? li-mādhā lā yataḥaddathu ma3anā?"}
        hl:
          - ["لَيْش", "lēš", "لِماذا", "li-mādhā", q, "'Why': MSA li-mādhā 'for what?'. Shami lēš is usually traced to li-ʔayy šī 'for which thing?', squeezed into one syllable."]
          - ["مَعْنا", "ma3na", "مَعَنا", "ma3anā", pron, "'With us': the same word and the same ending -na; Shami drops the short vowel."]
      - ref: [L016, 7]
        msa: {ar: "نَبيلٌ يَعْمَلُ كَثيرًا هٰذِهِ الأَيّامَ. لٰكِنَّهُ بِخَيْرٍ، وَاللّٰهِ.", tr: "Nabīlun ya3malu kathīran hādhihi l-ʔayyāma. lākinnahu bi-xayrin, wallāhi."}
        hl:
          - ["هالأَيّام", "hal-ʔayyām", "هٰذِهِ الأَيّامَ", "hādhihi l-ʔayyāma", dem, "'These days': MSA hādhihi 'this (f)' + the article; Shami just glues on hal-, which never changes for gender or number."]
          - ["بَسّ هُوّ", "bass huwwe", "لٰكِنَّهُ", "lākinnahu", pron, "'But he': Shami bass + huwwe (MSA huwa, with the w doubled). MSA attaches 'him' to lākinna: lākinna-hu."]
      - ref: [L017, 2]
        msa: {ar: "لِأَنَّ أَبي يَقولُ دائِمًا: لَيْسَ الآنَ، لَيْسَ الآنَ.", tr: "li-ʔanna ʔabī yaqūlu dāʔiman: laysa l-ʔāna, laysa l-ʔāna."}
        hl:
          - ["لَإنّو", "laʔinno", "لِأَنَّ", "li-ʔanna", conj, "'Because': the same word. Shami adds -o 'it' and changes the vowels: laʔinno."]
          - ["بْيِقول", "biʔūl", "يَقولُ", "yaqūlu", b1, "'He says': q → ʔ, and b- in front: yaqūlu → biʔūl."]
          - ["مو هَلّق", "mū hallaʔ", "لَيْسَ الآنَ", "laysa l-ʔāna", words, "'Not now': Shami mū, MSA laysa. Two different words for 'now' too: hallaʔ and al-ʔāna."]
      - ref: [L017, 3]
        msa: {ar: "وَمَتى يُريدُ أَنْ يَأْتِيَ؟", tr: "wa-matā yurīdu ʔan yaʔtiya?"}
        hl:
          - ["إيمْت", "ʔēmat", "مَتى", "matā", q, "'When?': MSA matā; Shami ʔēmat, probably from ʔayy matā 'which when'."]
          - ["يِجي", "yiji", "أَنْ يَأْتِيَ", "ʔan yaʔtiya", words, "'(To) come': Shami ʔija, MSA ʔatā (or jāʔa). MSA also needs ʔan and the ending -a after 'want' (Bridge 2)."]
      - ref: [L017, 4]
        msa: {ar: "لا أَعْرِفُ... عِنْدَما يَنْتَهي العَمَلُ، يَقولُ.", tr: "lā ʔa3rifu... 3indamā yantahī l-3amalu, yaqūlu."}
        hl:
          - ["لَمّا", "lamma", "عِنْدَما", "3indamā", conj, "'When' in a statement: MSA 3indamā; Shami lamma. MSA also has lammā, but only for the past."]
          - ["الشُّغِل", "iš-šuɣil", "العَمَلُ", "l-3amalu", words, "'Work': Shami šuɣil, MSA 3amal, matching the verbs ištaɣal and 3amila (Bridge 2)."]
      - ref: [L018, 4]
        msa: {ar: "حاضِر! ... يا آدَمُ، لا تَبْكِ!", tr: "ḥāḍir! ... yā ʔādamu, lā tabki!"}
        hl:
          - ["لا تِبْكي", "lā tibki", "لا تَبْكِ", "lā tabki", imp, "'Don't cry': lā in both. MSA cuts the long final vowel (tabki, short i); Shami keeps the plain form tibki."]
      - ref: [L019, 1]
        msa: {ar: "غَدًا الجُمُعَةُ. ماذا سَنَفْعَلُ؟", tr: "ɣadan al-jumu3atu. mādhā sa-naf3alu?"}
        hl:
          - ["بُكْرا", "bukra", "غَدًا", "ɣadan", words, "'Tomorrow': MSA ɣadan; Shami bukra, from MSA bukra 'early morning'."]
          - ["رَح نَعْمِل", "raḥ na3mil", "سَنَفْعَلُ", "sa-naf3alu", fut, "'We will do': MSA puts sa- on the verb (or sawfa before it). Shami uses raḥ, from rāḥ 'to go', like English 'going to'."]
    rules:
      - id: pron
        title: "Pronouns"
        short: "pronouns"
        text: "MSA ʔanā, ʔanta, ʔanti, huwa, hiya, naḥnu, ʔantum, hum. Shami ʔana, ʔinte, ʔinti, huwwe, hiyye, niḥna, ʔintu, hinne. The endings are one family: -ī / -i 'my', -ka / -ak 'your', -hu / -o 'his', -nā / -na 'our'."
      - id: dem
        title: "This and these"
        short: "this"
        text: "MSA hādhā (m), hādhihi (f), hāʔulāʔi (pl). Shami hāda, hāy, hadōl. Before a noun with the article, Shami can use the short hal- for all of them: hal-bēt, hal-ʔayyām."
      - id: q
        title: "Question words"
        short: "question words"
        text: "MSA mā / mādhā 'what', man 'who', ʔayna 'where', matā 'when', li-mādhā 'why', kayfa 'how', kam 'how much, how many'. Shami šū, mīn, wēn, ʔēmat, lēš, kīf, ʔaddēš / kam."
      - id: conj
        title: "Because, when, if"
        short: "linking words"
        text: "MSA li-ʔanna 'because', 3indamā 'when', ʔidhā 'if'. Shami laʔinno, lamma, ʔiza."
      - id: fut
        title: "The future"
        short: "future"
        text: "MSA sa- or sawfa + the present: sa-ʔaktubu 'I will write'. Shami raḥ + the verb without b-: raḥ iktub."
      - id: imp
        title: "Don't!"
        short: "negative orders"
        text: "Both use lā. MSA shortens the verb (lā taktub, lā tabki); Shami uses its plain form without b- (lā tiktub, lā tibki)."
      - id: words
        title: "Different words"
        short: "other words"
        text: "bukra / ɣadan 'tomorrow', hallaʔ / al-ʔāna 'now', šuɣil / 3amal 'work', ḥaka / taḥaddatha 'talk'. Syrians understand both columns; they say the first."
      - id: b1
        title: "The sounds of Bridge 1"
        short: "Bridge 1 sounds"
        text: "q said ʔ, endings dropped, short vowels lost: Bridge 1 applies to every word."
    practice:
      fill:
        - {tr: "MSA mādhā → Shami ___", answer: "šū", en: "what"}
        - {tr: "MSA matā → Shami ___", answer: "ʔēmat", en: "when?"}
        - {tr: "MSA li-mādhā → Shami ___", answer: "lēš", en: "why"}
        - {tr: "MSA li-ʔanna → Shami ___", answer: "laʔinno", en: "because"}
        - {tr: "MSA sa-naf3alu → Shami ___", answer: "raḥ na3mil", en: "we will do"}
        - {tr: "MSA hādhihi l-ʔayyām → Shami ___", answer: "hal-ʔayyām", en: "these days"}
